services:
  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./nginx-vhost:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
    labels:
      com.github.nginx-proxy.nginx: "true"
    networks:
      - nginx-proxy

  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion
    container_name: nginx-letsencrypt
    restart: unless-stopped
    depends_on:
      - nginx-proxy
    environment:
      NGINX_PROXY_CONTAINER: nginx-proxy
      DEFAULT_EMAIL: niyamulahsan@gmail.com
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./nginx-vhost:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
      - ./acme:/etc/acme.sh
    networks:
      - nginx-proxy

  mysql:
    image: mysql:8.0
    container_name: mysql-global
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_global_data:/var/lib/mysql
    networks:
      - infra

  redis:
    image: redis:alpine
    container_name: redis-global
    restart: unless-stopped
    volumes:
      - redis_global_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - infra

  # phpMyAdmin: domain + port
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql-global
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      VIRTUAL_HOST: pma.vatmate.org,pma.sarra.app,pma.old.vatmate.org
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: pma.vatmate.org,pma.sarra.app,pma.old.vatmate.org
      LETSENCRYPT_EMAIL: niyamulahsan@gmail.com
    networks:
      - infra
      - nginx-proxy

  # PostgreSQL: global, INTERNAL ONLY (no ports exposed)
  postgres:
    image: postgres:16-alpine
    container_name: postgres-global
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_global_data:/var/lib/postgresql/data
    networks:
      - infra

  # pgAdmin: domain + port
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      VIRTUAL_HOST: pga.vatmate.org
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: pga.vatmate.org
      LETSENCRYPT_EMAIL: niyamulahsan@gmail.com
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - infra
      - nginx-proxy

volumes:
  mysql_global_data:
  redis_global_data:
  postgres_global_data:
  pgadmin_data:

networks:
  nginx-proxy:
    external: true
    name: nginx-proxy
  infra:
    external: true
    name: infra
